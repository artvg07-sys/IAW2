<VirtualHost *:80>
    ServerName alfa.nimbus-lab.local
    DocumentRoot /var/www/html/marca-alfa

    <Directory /var/www/html/marca-alfa>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog logs/alfa_error.log
    CustomLog logs/alfa_access.log combined
</VirtualHost>
