; PHP de producción para la web de Radio Marea (UD4, apartados 6 y 7).
; PHP-FPM lo lee al arrancar: después de cambiarlo, ./practica.sh recargar
;
; ✍️ A2 · Escribe aquí las directivas para que:
;    - la web no diga qué versión de PHP usa (la cabecera X-Powered-By);
;    - el oyente nunca vea un error de PHP, pero tú sí: en /var/log/radio/php-errores.log (es la carpeta logs/ del kit);
;    - nadie pueda ejecutar órdenes del sistema desde PHP: exec, shell_exec, system, passthru, proc_open y popen.

; ==========================================
; A2 - Configuracion segura de PHP
; ==========================================

; A2.1 - Ocultar la version de PHP
expose_php = Off

; A2.2 - Ocultar errores y registrarlos
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/radio/php-errores.log

; A2.3 - Deshabilitar funciones peligrosas
disable_functions = exec,shell_exec,system,passthru,proc_open,popen
